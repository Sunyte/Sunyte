[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunyte"
version = "0.2.0"
description = "A flight recorder for AI agents: blocks dangerous actions before they run, tracks real spend with a kill switch, and keeps a tamper-evident replay of every session."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "guardrails", "observability", "audit", "compliance", "cost-tracking"]
# The core (hooks, guard, CLI, tamper-evident log) runs on the Python standard
# library alone. Extras below are only for optional integrations.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0,<7.0"]
groq = ["groq>=0.11,<1.0"]
langchain = ["langchain-core>=0.3.33,<0.4.0", "langchain-groq>=0.2.4,<1.0"]

[project.urls]
Homepage = "https://github.com/Augustya08/Sunyte"
Repository = "https://github.com/Augustya08/Sunyte"

[project.scripts]
sunyte = "sunyte.cli:main"

[tool.setuptools.packages.find]
include = ["sunyte*"]
