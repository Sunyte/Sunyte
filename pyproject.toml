[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunyte"
version = "0.1.0"
description = "A flight recorder for AI agents: logs every tool call, blocks dangerous actions, tracks spend, and alerts you when something goes wrong."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
groq = ["groq>=0.11,<1.0"]
langchain = ["langchain-core>=0.3.33,<0.4.0", "langchain-groq>=0.2.4,<1.0"]

[project.scripts]
sunyte = "sunyte.cli:main"

[tool.setuptools.packages.find]
include = ["sunyte*"]
