# ---------------------------------------------------------------------------
# config.yaml is OPTIONAL.
#
# Sunyte ships with sensible defaults (see sunyte/defaults.py) and works with
# no config at all. Per-project blocklist changes are easiest through:
#
#     /sunyte-block add "npm publish"        (inside Claude Code)
#     sunyte block add "npm publish"         (on the CLI)
#
# ...which writes .sunyte/rules.json. Use this file only if you'd rather keep
# limits and rules in version control as YAML. It needs PyYAML installed
# (`pip install pyyaml`); without it this file is ignored and defaults apply.
#
# Anything set here overrides a default; anything omitted keeps the default.
# Re-read on every check — no restart needed.
# ---------------------------------------------------------------------------

limits:
  max_session_minutes: 600
  max_tool_calls: 200
  max_spend_usd: 5.00            # kill switch: stop the session past this spend
  spend_warning_pcts: [50, 75, 90]

# Added on top of the built-in list, not instead of it.
dangerous_bash_patterns:
  - "rm -rf"
  - "git push --force"

dangerous_regex_patterns:
  - "drop\\s+table"

protected_paths:
  - ".env"
  - ".ssh/"

# Slack alerting requires the Team tier (sunyte tier activate <token>).
alerts:
  slack_webhook_url: ""
  enabled: false
  # Compliance tier only:
  escalation_emails: []
  escalation_webhook_url: ""
